<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear cuenta - Gestor de Tareas</title>

    <!-- Aplica el tema guardado antes de pintar, para evitar parpadeo -->
    <script>
        document.documentElement.setAttribute('data-theme', localStorage.getItem('theme') || 'dark');
    </script>

    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/login-styles.css">
</head>
<body class="login-page">

    <div class="login-container">
        <div class="login-theme-switcher">
            <button class="theme-btn" data-theme="dark" title="Oscuro"></button>
            <button class="theme-btn" data-theme="light" title="Claro"></button>
        </div>

        <div class="login-card">
            <div class="login-header">
                <h2>Crea tu cuenta ✨</h2>
                <p>Regístrate para empezar a organizar tus tareas</p>
            </div>

            <div id="registerError" class="error-message" style="display:none;"></div>

            <form id="registerForm" class="login-form">
                <div class="form-group">
                    <label for="email">Correo electrónico</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="tu@correo.com"
                        required
                        autocomplete="email"
                    >
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Mínimo 8 caracteres"
                        required
                        autocomplete="new-password"
                    >
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirmar contraseña</label>
                    <input
                        type="password"
                        id="confirmPassword"
                        name="confirmPassword"
                        placeholder="Repite la contraseña"
                        required
                        autocomplete="new-password"
                    >
                </div>

                <button type="submit" class="btn-primary btn-block">Crear cuenta</button>
            </form>

            <div class="login-footer">
                <p>¿Ya tienes una cuenta? <a href="login.html">Inicia sesión aquí</a></p>
            </div>
        </div>
    </div>

    <script type="module" src="../js/register.js"></script>
    <script>
        document.querySelectorAll('.login-theme-switcher .theme-btn').forEach(btn => {
            const saved = localStorage.getItem('theme') || 'dark';
            if (btn.dataset.theme === saved) btn.classList.add('active');

            btn.addEventListener('click', () => {
                const theme = btn.dataset.theme;
                document.documentElement.setAttribute('data-theme', theme);
                localStorage.setItem('theme', theme);
                document.querySelectorAll('.login-theme-switcher .theme-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
            });
        });
    </script>
</body>
</html>
