<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro - Gestor de Tareas</title>
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/login-styles.css">
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <h2>Crear Cuenta</h2>
      <p class="subtitle">Regístrate para empezar a organizar tus tareas</p>

      <form id="registerForm" novalidate>
        <div class="form-group">
          <label for="name">Nombre Completo</label>
          <input type="text" id="name" name="name" placeholder="Tu nombre" required>
        </div>

        <div class="form-group">
          <label for="email">Correo Electrónico</label>
          <input type="email" id="email" name="email" placeholder="ejemplo@correo.com" required>
        </div>

        <div class="form-group">
          <label for="password">Contraseña</label>
          <input type="password" id="password" name="password" placeholder="••••••••" required>
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirmar Contraseña</label>
          <input type="password" id="confirmPassword" name="confirmPassword" placeholder="••••••••" required>
        </div>

        <div id="errorMessage" class="error-message" style="display: none;"></div>

        <button type="submit" class="btn-primary" id="btnRegister">Registrarse</button>
      </form>

      <div class="auth-footer">
        <p>¿Ya tienes una cuenta? <a href="login.html">Inicia sesión</a></p>
      </div>
    </div>
  </div>

  <script src="../js/register.js"></script>
</body>
</html>
